<title>PANFLITO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preload" href="img/mapa.png" as="image" fetchpriority="high">
<link rel="preload" href="mapa.json" as="fetch" crossorigin>
<!-- Estadísticas (Google Analytics de panflito). Carga aparte, no frena la página. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FT1MZMMREN"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-FT1MZMMREN');</script>
<style>
/* layout: solo el dibujo. Su línea es el mapa: cada tramo de color es una línea, con sus paradas encima */
:root{
  --papel:#fbfaf7; --tinta:#141312;
  --titulo:"Gill Sans","Gill Sans MT","Gill Sans Nova",Lato,"Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--titulo);overflow-x:clip}
a{color:inherit;text-decoration:none}
/* el nombre queda para Google y lectores de pantalla; a la vista, solo el dibujo */
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;margin:0}
.pagina{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:72px 64px}
/* la tinta del dibujo va del 4,36% al 94,07% del ancho de la imagen: se corre 0,79% a la derecha para que quede centrada */
.mapa{position:relative;width:100%;max-width:520px;margin:0 auto;left:.79%}
.mapa img{display:block;width:100%;height:auto;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.18))}
.paradas{list-style:none;margin:0;padding:0}
/* parada: circulito de estación sobre la línea */
.parada{position:absolute;width:0;height:0}
.parada .punto{position:absolute;left:0;top:0;width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);border-radius:50%;
  background:var(--papel);border:calc(var(--d) * .27) solid var(--c);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.parada.principal{--d:15px}
.parada.chica{--d:9px}
/* nombre en diagonal hacia arriba, como en el plano del subte */
.parada .nombre{position:absolute;left:7px;bottom:5px;white-space:nowrap;font-weight:600;font-size:13.5px;line-height:1;color:var(--c);transform-origin:0 100%;transform:rotate(-45deg);padding:3px 2px;
  text-shadow:0 0 2px var(--papel),0 0 2px var(--papel),0 0 4px var(--papel),0 0 4px var(--papel)}
/* zona de toque cómoda para el dedo */
.parada a{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%}
.parada.principal a{width:auto;height:auto;left:0;top:0}
.parada.principal a::before{content:"";position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%}
.parada a:hover .nombre,.parada a:active .nombre,.parada a:focus-visible .nombre{background:#fff23a;text-shadow:none}
.parada a:focus-visible{outline:none}
.parada a:focus-visible .punto,.parada.chica a:focus-visible{box-shadow:0 0 0 3px var(--tinta)}
</style>

<div class="pagina">
  <h1>PANFLITO</h1>
  <div class="mapa" id="mapa">
    <img src="img/mapa.png" width="1400" height="1400" fetchpriority="high" alt="Casa del árbol dibujada en marcador: cada tramo de color es una línea">
    <ul class="paradas" id="paradas" aria-label="Paradas"></ul>
  </div>
</div>

<script>
(()=>{
const contar=(ev,datos)=>{try{window.gtag&&gtag('event',ev,datos)}catch(e){}};
fetch('mapa.json').then(r=>r.json()).then(M=>{
  const ul=document.getElementById('paradas');
  M.paradas.forEach(p=>{
    const l=M.lineas[p.linea],li=document.createElement('li');
    li.className='parada '+p.tipo;li.style.left=(p.x*100)+'%';li.style.top=(p.y*100)+'%';li.style.setProperty('--c',l.tonos[1]);
    let dentro='<span class="punto"></span>';
    if(p.tipo==='principal'&&p.nombre){const n=document.createElement('span');n.className='nombre';n.textContent=p.nombre;dentro+=n.outerHTML}
    if(p.url){
      const a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='noopener';a.innerHTML=p.tipo==='principal'?dentro:'';
      if(p.nombre)a.setAttribute('aria-label',p.nombre);
      a.addEventListener('click',()=>contar('abrir_parada',{linea:l.letra,parada:p.nombre}));
      if(p.tipo==='principal')li.appendChild(a);else{li.innerHTML=dentro;li.appendChild(a)}
    }else{
      li.innerHTML=dentro;if(p.nombre)li.setAttribute('aria-label',p.nombre);
    }
    ul.appendChild(li);
  });
}).catch(()=>{});
})();
</script>
