<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PANFLITO</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preload" href="img/mapa.png" as="image" fetchpriority="high">
<style>
/* prototipo: el dibujo es el mapa. Cada parte del dibujo es una sección, con su color; abajo van las cinco, una tras otra */
:root{
  --papel:#fbfaf7; --tinta:#141312; --gris:#7a766e;
  --titulo:"Gill Sans","Gill Sans MT","Gill Sans Nova",Lato,"Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:clip;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--titulo);overflow-x:clip}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--tinta);outline-offset:3px}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;margin:0}
.pagina{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:64px 80px}

/* el mapa */
.mapa{position:relative;width:100%;max-width:520px;margin:0 auto;cursor:pointer}
.mapa img{display:block;width:100%;height:auto;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.18))}
.nombre{position:absolute;white-space:nowrap;font-weight:600;font-size:13px;line-height:1;transform-origin:0 100%;transform:rotate(-45deg);padding:3px 2px;
  text-shadow:0 0 2px var(--papel),0 0 2px var(--papel),0 0 4px var(--papel),0 0 4px var(--papel)}
.nombre:hover,.nombre:active{background:#fff23a}

/* las secciones, una tras otra: no hay que elegir nada */
.seccion{position:relative;margin-top:64px;scroll-margin-top:24px;display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:0}
.seccion h2{grid-column:2;margin:0 0 4px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--c1)}
.seccion .dibujo{grid-column:1;grid-row:1 / span 2;width:40px;height:40px;object-fit:none;align-self:start}
.via{grid-column:1 / -1;list-style:none;margin:18px 0 0;padding:0 0 0 14px;position:relative}
/* el tubo: los mismos tonos del escaneo, de un borde al otro */
.via::before{content:"";position:absolute;left:14px;top:-10px;bottom:-10px;width:15.5px;border-radius:8px;
  background:linear-gradient(90deg,var(--c2) 0,var(--c3) 22%,var(--c1) 45%,var(--c1) 62%,var(--c0) 100%);
  box-shadow:3px 5px 10px rgba(0,0,0,.2)}
.via li{position:relative;height:74px}
.via li::before{content:"";position:absolute;left:4.2px;top:50%;width:7.1px;height:7.1px;margin-top:-3.5px;border-radius:50%;background:var(--papel);z-index:1}
.via li.punta{height:8px}
.via .n{position:absolute;left:26px;top:50%;white-space:nowrap;font-weight:600;font-size:13px;line-height:1;transform-origin:0 100%;transform:translateY(-100%) rotate(-45deg);color:var(--c1);padding:3px 2px}
.via a.n:hover,.via a.n:active{background:#fff23a}
.via .n.sin{color:var(--gris)}
</style>
</head>
<body>
<div class="pagina">
  <h1>PANFLITO</h1>
  <div class="mapa" id="mapa">
    <img id="dibujo" src="img/mapa.png" width="1400" height="1400" fetchpriority="high" alt="Casa del árbol: cada parte del dibujo es una sección">
  </div>
  <main id="secciones"></main>
</div>

<script>
(()=>{
// qué parte del dibujo es cada sección, dónde va su nombre (fracción del dibujo) y sus tonos
const PARTES=[
  {id:'b',parte:'casa',    nx:.20,ny:.045},
  {id:'h',parte:'escalera',nx:.44,ny:.64},
  {id:'d',parte:'copa',    nx:.60,ny:.10},
  {id:'e',parte:'tronco',  nx:.885,ny:.52},
  {id:'a',parte:'suelo',   nx:.36,ny:1.05}
];
const VIOLETA=["#4a2a66","#673b8a","#7a4d9e","#9d78bd"];
const $=id=>document.getElementById(id);

Promise.all([fetch('paradas.json').then(r=>r.json()),fetch('ramas.json').then(r=>r.json())]).then(([D,A])=>{
  A.colores.violeta=VIOLETA;
  const lineas={};D.lineas.forEach(l=>lineas[l.id]=l);
  lineas.e={id:'e',nombre:'Docente',color:'violeta',paradas:[{titulo:'',tipo:'espacio'},{titulo:'',tipo:'espacio'}]};
  const mapa=$('mapa'),sec=$('secciones');
  PARTES.forEach(p=>{
    const l=lineas[p.id],t=A.colores[l.color];
    // nombre sobre el dibujo, en diagonal
    const a=document.createElement('a');a.className='nombre';a.href='#linea-'+l.id;a.textContent=l.nombre;a.style.color=t[1];
    a.style.left=(p.nx*100)+'%';a.style.top=(p.ny*100)+'%';a.style.marginTop='-1.2em';mapa.appendChild(a);
    // sección
    const s=document.createElement('section');s.className='seccion';s.id='linea-'+l.id;
    ['--c0','--c1','--c2','--c3'].forEach((k,i)=>s.style.setProperty(k,t[i]));
    let h=`<h2>${l.nombre}</h2><ul class="via"><li class="punta"></li>`;
    l.paradas.forEach(pa=>{
      if(!pa.titulo||pa.tipo==='espacio'){h+='<li></li>';return}
      h+=pa.url?`<li><a class="n" href="${pa.url}"${pa.tipo==='link'?' target="_blank" rel="noopener"':''}>${pa.titulo}</a></li>`:`<li><span class="n sin">${pa.titulo}</span></li>`;
    });
    s.innerHTML=h+'<li class="punta"></li></ul>';sec.appendChild(s);
  });
  // tocar una parte del dibujo lleva a su sección
  const z=new Image();z.src='img/zonas.png';let zc=null;
  z.onload=()=>{const c=document.createElement('canvas');c.width=z.width;c.height=z.height;zc=c.getContext('2d');zc.drawImage(z,0,0)};
  $('dibujo').addEventListener('click',e=>{
    if(!zc)return;const r=e.currentTarget.getBoundingClientRect();
    const x=Math.floor((e.clientX-r.left)/r.width*z.width),y=Math.floor((e.clientY-r.top)/r.height*z.height);
    const k=Math.round(zc.getImageData(x,y,1,1).data[0]/50);if(!k)return;
    document.getElementById('linea-'+PARTES[k-1].id).scrollIntoView();
  });
});
})();
</script>
</body>
</html>
