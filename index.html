<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Panflito: la casa del árbol de Theo Fernandez Noguera, con cuatro líneas: Theo y Simón, YouTube, escritos y arte visual.">
<title>PANFLITO</title>
<link rel="preload" href="img/casa.png" as="image" fetchpriority="high">
<link rel="preload" href="paradas.json" as="fetch" crossorigin>
<link rel="preload" href="piezas.json" as="fetch" crossorigin>
<link rel="preload" href="img/verde-parada.webp" as="image">
<link rel="preload" href="img/verde-arranque.webp" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="icon" href="img/verde-parada.webp">
<style>
body{margin:0}

/* layout: una sola vía de palitos escaneados que cuelga de la casa y baja por toda la página; cambia de línea en cada codo */
:root{
  --papel:#fbfaf7; --tinta:#141312; --gris:#7a766e; --raya:#e4e1da;
  --d:#2D7539; --b:#C32D27; --h:#C3932D; --a:#4581BD;
  --titulo:"Gill Sans","Gill Sans MT","Gill Sans Nova",Lato,"Trebuchet MS",sans-serif;
  --texto:"EB Garamond","Times New Roman",Times,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:18px;line-height:1.35;overflow-x:clip}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--tinta);outline-offset:3px}

.pagina{position:relative;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 0}
.inicio{display:grid;justify-items:center;position:relative;z-index:1}
.inicio h1{font-family:var(--titulo);font-weight:600;font-size:clamp(30px,9vw,46px);letter-spacing:.14em;margin:0;padding-left:.14em;line-height:1.1}
.pista{font-family:var(--titulo);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);margin:6px 0 4px;transition:opacity .3s}
.mesa{width:100%;max-width:520px}
.mesa img{display:block;width:100%;height:auto}

/* la vía: piezas escaneadas encadenadas */
.via{position:absolute;inset:0;z-index:2;pointer-events:none}
.pieza{position:absolute;top:0;left:0;display:block;transform-origin:0 0;will-change:transform;filter:drop-shadow(1px 2px 1.5px rgba(0,0,0,.18));transition:filter .18s}
.pieza.alzada{filter:drop-shadow(4px 8px 6px rgba(0,0,0,.3))}
.ramal{position:absolute;inset:0;pointer-events:none;will-change:opacity}
.ramal a{pointer-events:auto}

/* chapas de línea */
.chapa{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--titulo);font-weight:700;font-size:17px;line-height:1;box-shadow:0 0 0 2px var(--papel);flex:none}
.chapa.osc{color:#1d1606}
.toque{position:absolute;pointer-events:auto;z-index:4;display:block}
.toque .chapa{position:absolute;left:50%;bottom:0;transform:translate(-50%,0)}

/* carteles y paradas, al costado de la vía ya derecha */
.rotulos{position:absolute;inset:0;z-index:3;pointer-events:none}
.rotulo{position:absolute;left:0;display:flex;align-items:center;pointer-events:auto;transform:translateY(-50%);will-change:opacity}
.rotulo .txt{display:grid;gap:1px;line-height:1.2;padding:4px 6px;min-width:0}
.rotulo .t{font-size:20px;overflow-wrap:anywhere;background:var(--papel)}
.rotulo .m{font-family:var(--titulo);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris)}
.rotulo:hover .t,.rotulo:active .t{background:color-mix(in srgb,var(--c) 24%,var(--papel))}
.rotulo.sin .t{color:var(--gris)}
.cartel{position:absolute;left:0;display:flex;align-items:center;gap:10px;transform:translateY(-50%);pointer-events:none}
.cartel .chapa{width:38px;height:38px;font-size:21px}
.cartel h2{font-family:var(--titulo);font-weight:600;font-size:22px;margin:0;line-height:1.05;background:var(--papel);padding-right:6px}
.cartel p{margin:2px 0 0;font-family:var(--titulo);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris)}
.ancla{position:absolute;left:0;width:1px;height:1px}

/* tablero fijo */
.tablero{position:fixed;top:0;left:0;right:0;z-index:9;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--papel) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--raya);opacity:0;transform:translateY(-100%);transition:opacity .25s,transform .25s}
.tablero.ver{opacity:1;transform:none}
.tablero .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:12px}
.tablero .marca{font-family:var(--titulo);font-weight:600;letter-spacing:.14em;font-size:14px;margin-right:auto}
.tablero nav{display:flex;gap:10px}
.tablero nav a{opacity:.38;transition:opacity .2s,transform .2s}
.tablero nav a[aria-current="true"]{opacity:1;transform:scale(1.12)}

footer{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;border-top:1px solid var(--raya);display:flex;gap:20px;font-family:var(--titulo);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
footer a:hover{background:#ffef5c}

dialog{border:0;padding:0;background:transparent;max-width:min(94vw,900px);max-height:92vh}
dialog::backdrop{background:rgba(20,19,18,.82)}
dialog figure{margin:0;display:grid;gap:10px}
dialog img{max-width:100%;max-height:80vh;width:auto;height:auto;display:block;margin:0 auto;background:var(--papel)}
dialog figcaption{color:#fbfaf7;font-size:18px;text-align:center}
dialog button{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));font:inherit;font-size:28px;line-height:1;width:44px;height:44px;border-radius:50%;border:0;background:var(--papel);color:var(--tinta);cursor:pointer}
</style>
</head>
<body>
<div class="tablero" id="tablero">
  <div class="in">
    <a class="marca" href="#arriba">PANFLITO</a>
    <nav id="nav" aria-label="Líneas"></nav>
  </div>
</div>

<div class="pagina" id="pagina">
  <span class="ancla" id="arriba" style="top:0"></span>
  <header class="inicio">
    <h1>PANFLITO</h1>
    <p class="pista" id="pista">Tocá una línea o bajá</p>
    <div class="mesa" id="mesa"><img src="img/casa.png" fetchpriority="high" alt="Casa del árbol dibujada en marcador sobre una servilleta" width="1400" height="1400"></div>
  </header>
  <div class="via" id="via" aria-hidden="true"></div>
  <nav class="rotulos" id="rotulos" aria-label="Paradas"></nav>
</div>

<footer id="pie">
  <a href="https://www.instagram.com/theofernandezn/" target="_blank" rel="noopener">Instagram ↗</a>
  <a href="https://foundation.app/@theofn" target="_blank" rel="noopener">Foundation ↗</a>
</footer>

<dialog id="visor" aria-label="Imagen">
  <button type="button" id="cerrar" aria-label="Cerrar">×</button>
  <figure><img id="visorImg" alt=""><figcaption id="visorTxt"></figcaption></figure>
</dialog>

<script>
(()=>{
/* ================= ajustes ================= */
const K=0.5;              // px de pantalla por px de pieza (las piezas están al doble para pantallas retina)
const VAR={verde:'--d',rojo:'--b',amarillo:'--h',azul:'--a'};
// de dónde cuelga cada palito sobre la servilleta (fracción del ancho del dibujo) y cuánto se tuerce
const CUELGA={
  verde:   {x:.15, y:.915, curva:[10,4,-3,-6,-4,-1]},
  rojo:    {x:.30, y:.915, curva:[4,2,-2,-3,-1]},
  amarillo:{x:.64, y:.86,  curva:[14,6,-4,-7,-5,-2]},
  azul:    {x:.86, y:.42,  curva:[-5,-2,2,4,1]}
};
const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= utilidades ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chapa=l=>`<span class="chapa${l.color==='amarillo'?' osc':''}" style="--c:var(${VAR[l.color]})">${esc(l.letra)}</span>`;
const meta=p=>p.detalle||({texto:'Texto',imagen:'Imagen',link:'Link',pronto:'Próximamente'}[p.tipo]||'');
const R=d=>d*Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const suave=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;

let P,D,cadena=[],ramales=[],rotulos=[],carteles=[],geo=null,s=0;

/* ================= armado de la vía =================
   Una sola cadena: arranque verde, paradas de D, codo (transbordo) rojo, paradas de B,
   codo amarillo, paradas de H, codo celeste, paradas de A, punta final. */
function armar(){
  const via=$('via'),rot=$('rotulos'),nav=$('nav');
  const pieza=(color,tipo)=>{
    const m=P[color][tipo],img=new Image();
    img.src=`img/${color}-${tipo}.webp`;img.alt='';img.decoding='async';img.className='pieza';
    img.width=Math.round(m.w*K);img.height=Math.round(m.h*K);
    return {el:img,w:m.w*K,h:m.h*K,cin:(m.cxIn??m.cx)*K,cout:(m.cxOut??m.cx)*K,tipo,color};
  };
  D.lineas.forEach((l,li)=>{
    // pieza de entrada de cada línea: el arranque para la primera, un codo para las demás.
    // Los codos alternan el sentido (izquierda, derecha, izquierda) para que la vía no se vaya de la pantalla.
    const ent=pieza(l.color,li===0?'arranque':'codo');ent.linea=li;ent.cartel=true;
    if(li>0&&li%2===0){ent.espejo=true;ent.cin=ent.w-ent.cin;ent.cout=ent.w-ent.cout}
    cadena.push(ent);
    l.paradas.forEach(pa=>{const p=pieza(l.color,'parada');p.linea=li;p.parada=pa;cadena.push(p)});
  });
  const ult=D.lineas[D.lineas.length-1];
  const fin=pieza(ult.color,'final');fin.linea=D.lineas.length-1;cadena.push(fin);
  cadena.forEach(p=>via.appendChild(p.el));

  // ramales de muestra que cuelgan en la portada (B, H, A) y se suben al tablero al bajar
  D.lineas.slice(1).forEach((l,i)=>{
    const g=document.createElement('div');g.className='ramal';
    const piezas=['arranque','parada','parada','codo','parada'].map(t=>pieza(l.color,t));
    piezas.forEach(p=>g.appendChild(p.el));
    const a=document.createElement('a');a.className='toque';a.href='#linea-'+l.id;a.setAttribute('aria-label','Línea '+l.letra+': '+l.nombre);a.innerHTML=chapa(l);
    g.appendChild(a);via.appendChild(g);
    ramales.push({l,g,piezas,toque:a});
  });
  // chapa de la D sobre la vía principal en la portada
  const tD=document.createElement('a');tD.className='toque';tD.href='#linea-'+D.lineas[0].id;tD.innerHTML=chapa(D.lineas[0]);tD.setAttribute('aria-label','Línea '+D.lineas[0].letra+': '+D.lineas[0].nombre);
  via.appendChild(tD);ramales.unshift({l:D.lineas[0],toque:tD,principal:true});

  // carteles, paradas y tablero
  cadena.forEach((p,i)=>{
    const l=D.lineas[p.linea];
    if(p.cartel){
      const n=l.paradas.length,c=document.createElement('div');c.className='cartel';c.style.setProperty('--c',`var(${VAR[l.color]})`);
      c.innerHTML=`${chapa(l)}<div><h2>${esc(l.nombre)}</h2><p>${n} ${n===1?'parada':'paradas'}</p></div>`;
      const an=document.createElement('span');an.className='ancla';an.id='linea-'+l.id;
      rot.appendChild(an);rot.appendChild(c);carteles.push({c,an,p,l});
    }
    if(p.parada){
      const pa=p.parada,ext=pa.tipo==='link';
      const tag=(pa.tipo==='pronto'||(!pa.url&&!pa.imagen))?'div':'a';
      const r=document.createElement(tag);r.className='rotulo'+(tag==='div'?' sin':'');r.style.setProperty('--c',`var(${VAR[l.color]})`);
      r.innerHTML=`<span class="txt"><span class="t">${esc(pa.titulo)}</span><span class="m">${esc(meta(pa))}${ext?' ↗':''}</span></span>`;
      if(tag==='a'){
        if(pa.tipo==='imagen'){r.href=pa.imagen;r.dataset.visor='1';r.dataset.t=pa.titulo}
        else{r.href=pa.url;if(ext){r.target='_blank';r.rel='noopener'}}
        const on=()=>p.el.classList.add('alzada'),off=()=>p.el.classList.remove('alzada');
        r.addEventListener('pointerenter',on);r.addEventListener('pointerleave',off);r.addEventListener('focus',on);r.addEventListener('blur',off);
      }
      rot.appendChild(r);rotulos.push({r,p});
    }
  });
  D.lineas.forEach(l=>{const a=document.createElement('a');a.href='#linea-'+l.id;a.dataset.id=l.id;a.setAttribute('aria-label',l.nombre);a.innerHTML=chapa(l);nav.appendChild(a)});
}

/* ================= geometría =================
   Cada pieza se apoya en el final de la anterior. El ángulo de cada unión es
   (ángulo de la vía derecha) + (curva de portada) × (cuánto falta enderezar esa unión).
   Las uniones de arriba se enderezan primero: la curva baja por la vía como un tren. */
function medir(){
  const pag=$('pagina'),mesa=$('mesa');
  const pr=pag.getBoundingClientRect(),mr=mesa.getBoundingClientRect();
  const W=mr.width,ox=mr.left-pr.left,oy=mr.top-pr.top;
  const gut=parseFloat(getComputedStyle(pag).paddingLeft)||16;
  const desv=P.verde.codo.cxIn*K-P.verde.codo.cxOut*K;     // cuánto corre a la izquierda cada codo
  const baseX=gut+desv+P.verde.parada.cx*K+2;              // columna de la vía derecha
  const c=CUELGA.verde;
  geo={W,ox,oy,gut,desv,baseX,
    x0:ox+c.x*W, y0:oy+c.y*W,                             // de dónde cuelga en la portada
    rango:Math.max(260,W*0.95)};                          // cuánto hay que bajar para que quede derecha
  // ángulos de la vía derecha: después de cada codo, la vía se inclina apenas hasta volver a su columna
  let xv=geo.baseX;const tope=R(9);
  cadena.forEach(p=>{
    if(p.tipo==='codo'||p.tipo==='arranque'){p.recta=0}
    else{const falta=geo.baseX-xv;p.recta=clamp(-Math.atan2(falta,p.h*0.9),-tope,tope);if(Math.abs(falta)<1)p.recta=0}
    xv+=(p.cout-p.cin)*Math.cos(p.recta)-p.h*Math.sin(p.recta);
  });
  // las uniones guardan la diferencia de ángulo
  let prev=0;cadena.forEach(p=>{p.uRecta=p.recta-prev;prev=p.recta});
  // posiciones finales (vía derecha) para carteles y paradas
  const fin=posar(cadena,geo.baseX,geo.y0,1,null);
  rotulos.forEach(o=>{const q=fin[cadena.indexOf(o.p)];o.y=q.y+o.p.h/2;o.x=q.x-o.p.cin+o.p.w-6});
  carteles.forEach(o=>{const i=cadena.indexOf(o.p),q=fin[i];o.y=q.y+o.p.h*(o.p.tipo==='codo'?0.62:0.45);o.x=geo.baseX+P.verde.parada.cx*K+18});
  rotulos.forEach(o=>{o.r.style.top=o.y+'px';o.r.style.left=o.x+'px';o.r.style.maxWidth=`calc(100% - ${o.x}px)`});
  carteles.forEach(o=>{o.c.style.top=o.y+'px';o.c.style.left=o.x+'px';o.an.style.top=(o.y-90)+'px'});
  const finY=fin[fin.length-1].y+cadena[cadena.length-1].h;
  pag.style.height=(finY+60)+'px';
}

// coloca una cadena desde (x,y); t = cuánto avanzó el enderezado; curva = ángulos de portada en grados
function posar(ch,x,y,t,curva){
  const out=[];let ang=0;
  const N=curva?curva.length:0;
  ch.forEach((p,i)=>{
    const c=curva&&i<N?R(curva[i]):0;
    const w=quieto?(t>0?1:0):suave(t*(N+2)-i*0.9);         // cada unión se endereza un poco después que la anterior
    ang+=(p.uRecta||0)+c*(1-w);
    out.push({x,y,ang});
    const dx=p.cout-p.cin,dy=p.h,cs=Math.cos(ang),sn=Math.sin(ang);
    x+=dx*cs-dy*sn;y+=dx*sn+dy*cs;
  });
  return out;
}
function dibujar(ch,pos){
  ch.forEach((p,i)=>{const q=pos[i];
    // muevo al punto de unión, giro, y corro la pieza para que su barra caiga justo ahí
    p.el.style.transform=`translate(${q.x}px,${q.y}px) rotate(${q.ang}rad) translate(${-p.cin}px,0)`+(p.espejo?` translate(${p.w}px,0) scale(-1,1)`:'');
  });
}

function cuadro(){
  if(!geo)return;
  const t=quieto?(scrollY>8?1:0):clamp(scrollY/geo.rango,0,1);
  s=t;
  // vía principal: arranca colgada de la escalera y se corre hasta su columna
  const x=lerp(geo.x0,geo.baseX,suave(t*1.15)),y=geo.y0;
  dibujar(cadena,posar(cadena,x,y,t,CUELGA.verde.curva));
  // chapa de la D en la punta de lo verde
  const rD=ramales[0];
  // ramales de muestra
  ramales.slice(1).forEach(o=>{
    const c=CUELGA[o.l.color];const x0=geo.ox+c.x*geo.W,y0=geo.oy+c.y*geo.W;
    o.piezas.forEach(p=>{if(p.uRecta===undefined)p.uRecta=0});
    const pos=posar(o.piezas,x0,y0,t,c.curva);dibujar(o.piezas,pos);
    const op=1-suave((t-0.15)/0.5);
    o.g.style.opacity=op;o.g.style.transform=`translateY(${-t*60}px)`;o.g.style.visibility=op<0.02?'hidden':'visible';
    const last=pos[pos.length-1],lp=o.piezas[o.piezas.length-1];
    o.toque.style.left=(last.x-20)+'px';o.toque.style.top=(last.y+lp.h-20)+'px';o.toque.style.width='40px';o.toque.style.height='48px';
  });
  // chapa D: sobre la última pieza verde
  const iv=cadena.findIndex(p=>p.linea===1)-1;
  const pv=posar(cadena,x,y,t,CUELGA.verde.curva)[iv];
  rD.toque.style.left=(pv.x-20)+'px';rD.toque.style.top=(pv.y+cadena[iv].h-10)+'px';rD.toque.style.width='40px';rD.toque.style.height='48px';
  rD.toque.style.opacity=1-suave((t-0.15)/0.5);rD.toque.style.visibility=t>0.7?'hidden':'visible';
  // textos aparecen cuando la vía ya está derecha
  const op=suave((t-0.7)/0.3);
  rotulos.forEach(o=>{o.r.style.opacity=op;o.r.style.visibility=op<0.02?'hidden':'visible'});
  carteles.forEach(o=>{o.c.style.opacity=op});
  $('pista').style.opacity=1-suave(t/0.3);
  $('tablero').classList.toggle('ver',t>0.85);
  // chapa activa
  const mitad=scrollY+innerHeight*0.45-($('pagina').getBoundingClientRect().top+scrollY);
  let act=carteles[0]?.l.id;carteles.forEach(o=>{if(o.y<=mitad)act=o.l.id});
  $('nav').querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',a.dataset.id===act));
}

let pedido=false;
const alScroll=()=>{if(pedido)return;pedido=true;requestAnimationFrame(()=>{pedido=false;cuadro()})};

/* ================= arranque ================= */
Promise.all([fetch('piezas.json').then(r=>r.json()),fetch('paradas.json').then(r=>r.json())]).then(([p,d])=>{
  P=p;D=d;armar();
  const listo=()=>{medir();cuadro()};
  const img=$('mesa').querySelector('img');
  if(img.complete)listo();else img.addEventListener('load',listo);
  listo();
  addEventListener('scroll',alScroll,{passive:true});
  addEventListener('resize',()=>{medir();cuadro()});
  if(document.fonts)document.fonts.ready.then(()=>{medir();cuadro()});
  if(location.hash&&location.hash!=='#arriba'){const el=document.querySelector(location.hash);if(el)setTimeout(()=>el.scrollIntoView(),50)}
}).catch(()=>{$('rotulos').innerHTML='<p style="position:absolute;top:110%;color:var(--gris)">No se pudieron cargar las paradas. Recargá la página.</p>'});

// visor de imágenes
const visor=$('visor');
document.addEventListener('click',e=>{const a=e.target.closest('a[data-visor]');if(!a)return;e.preventDefault();
  $('visorImg').src=a.getAttribute('href');$('visorImg').alt=a.dataset.t;$('visorTxt').textContent=a.dataset.t;visor.showModal()});
$('cerrar').onclick=()=>visor.close();
visor.addEventListener('click',e=>{if(e.target===visor)visor.close()});
})();
</script>
</body>
</html>
